<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sara's Kit Migration Roadmap | Whitney Bateson Digital Strategy</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,600&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/roadmap.css">
<style>
  /* Small additions for the migration roadmap; everything else comes from roadmap.css */
  .later-list { margin: 10px 0 0; padding-left: 20px; }
  .later-list li { margin: 4px 0; }
  .stop.ours-host .card { border-style: dashed; }
  .f-tip { background: #F4F9F8; border-radius: 10px; padding: 10px 14px; margin: 10px 0; font-size: .95em; }
</style>
</head>
<body>
<script>
  // Sara's settings. This is a String → Kit migration (not a DFY funnel build), so the page script lives below.
  window.MIGRATION = {
    client: "sara",                          // must match the folder name and clients.json
    token: "NNhSqUKaqMfKwfr2LqQJ4GEi",       // must match clients.json
    firstName: "Sara",

    // Mark each item true once it's in (your confirmation). When the first five are true, Step 1 hides itself.
    received: { kit: false, docs: false, pdfs: false, tags: false, domain: false, list: false, zap: false, final: false },

    // Test links for her review stops. Paste them in when each funnel is ready.
    reviewLinks: { pro: "#", client1: "#", client2: "#" },

    // Assumes the deposit is paid by Mon, Nov 9. If it's later, shift everything except Thanksgiving.
    dates: {
      kickoff: "2026-11-09",      // deposit paid, project starts
      assetsDue: "2026-11-12",    // Kit access, funnel docs, lead magnet PDFs, tag list, domain access
      kitReady: "2026-11-13",     // sending domain, template, tags
      hosting: "2026-11-14",      // Ian moves the site to WBDS hosting (weekend of Nov 14–15)
      hostingEnd: "2026-11-15",
      proReady: "2026-11-20",     // Nutrition Professionals funnel ready to test
      listDue: "2026-11-20",      // String subscriber export (Excel, with tags) + Zapier access
      proDue: "2026-11-24",       // her testing feedback on funnel 1
      proLive: "2026-11-24",      // website opt-in live + list imported
      awayStart: "2026-11-25",    // Thanksgiving
      awayEnd: "2026-11-27",
      adsOn: "2026-11-30",        // ads reconnected to Kit and turned back on
      clientReady: "2026-12-04",  // client funnels + evergreen ready to test
      clientDue: "2026-12-08",    // her testing feedback on client funnels
      clientLive: "2026-12-09",   // String forms swapped for Kit forms
      finalExport: "2026-12-09",  // final String export: only people who joined after Nov 20
      complete: "2026-12-11",     // final testing done, fully on Kit
      stringCancel: "2026-12-31"  // she cancels String
    }
  };
</script>
<script>
(function () {
  const C = window.MIGRATION, CLIENT = C.client, TOKEN = C.token, NAME = C.firstName, API = "/api";
  const EMAIL = "admin@whitneybateson.com";
  const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
  const fmt = d => d.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" });
  const short = d => d.toLocaleDateString("en-US", { month: "short", day: "numeric" });
  const ymd = d => d.getFullYear() + String(d.getMonth()+1).padStart(2,"0") + String(d.getDate()).padStart(2,"0");
  const iso = d => d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
  const addDay = d => { const n = new Date(d); n.setDate(n.getDate()+1); return n; };
  const esc = t => String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");
  const today = new Date(); today.setHours(0,0,0,0);
  const D = {}; Object.keys(C.dates).forEach(k => { D[k] = parse(C.dates[k]); });
  const got = C.received || {};
  const RL = C.reviewLinks || {};
  const live = u => u && u !== "#";
  const tick = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3 3 7-7" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const sign = "\n\nQuestions? Email us at " + EMAIL + " – we're happy to help!\n\nWhitney & Priscilla\nWhitney Bateson Digital Strategy";

  // ---- Step 1: what we need to get started ----
  const access = [
    { id: "kit", item: "Kit access", short: "Add " + EMAIL + " as a team member in Kit (Settings → Team). If your plan doesn't allow extra users, share your login through LastPass (or another secure password tool) with " + EMAIL + " instead." },
    { id: "docs", item: "Your funnel docs", short: "One Word doc per funnel (the 7-, 8- and 5-email sequences), with the tags, exit tags, links and buttons for each email." },
    { id: "pdfs", item: "Your lead magnet PDFs", short: "The final PDF for each of your three lead magnets." },
    { id: "tags", item: "Your tag list", short: "The tags you're keeping in Kit, so we can set them up before your list comes over." },
    { id: "domain", item: "Domain access for your hosting move", short: "Access to the registrar for bellyblissnutrition.com (wherever you bought your domain). Ian uses this to move your site to our hosting and to set up Kit's sending domain, so your emails land in inboxes. We'll email you exactly what he needs." }
  ];
  const step1Hidden = access.every(a => got[a.id]);

  // ---- Saved progress ----
  const KEY = "migration-" + CLIENT;
  let state = { checks: {}, sent: {} };
  try { state = Object.assign(state, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch (e) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };
  const itemDone = id => !!got[id] || !!state.checks[id];

  // ---- Stops ----
  const testHow = "Look over your opt-in page and thank-you page, then sign up yourself and go through the whole flow: the form, your lead magnet delivery and the emails as they arrive.";
  const stops = [
    { date: C.dates.assetsDue, yours: true, step1: true, title: "Send us your files and access",
      note: "Everything in Step 1 above. Once it's in, we start setting up Kit.",
      action: { href: "#access", text: "Get started", internal: true },
      calTitle: "Send Whitney's team your Kit files and access (Whitney Bateson, " + EMAIL + ")",
      calDetails: "Hi, " + NAME + "! Today's the day to send what we need for your Kit migration:\n\n→ Kit access (add " + EMAIL + " as a team member)\n→ Your funnel docs (7-, 8- and 5-email sequences)\n→ Your lead magnet PDFs\n→ Your tag list\n→ Domain access for your hosting move\n\nEverything's listed on your roadmap." + sign },
    { date: C.dates.kitReady, title: "Kit is set up",
      note: "Your sending domain, email template (footer, signature and socials) and tags are ready to go." },
    { date: C.dates.hosting, end: C.dates.hostingEnd, host: true, title: "Your website moves to our hosting",
      note: "Ian moves bellyblissnutrition.com to our hosting over the weekend, outside business hours, and checks that all of your sarakahnnutrition.com redirects still work. Kit's sending-domain records get added during the same change, so your domain only gets touched once." },
    { date: C.dates.listDue, yours: true, list: true, title: "Send your subscriber list",
      note: "Your String subscriber export as an Excel file, with the tags you're keeping. Also due: Zapier access, so we can connect your Facebook lead form to Kit.",
      calTitle: "Send your String subscriber list + Zapier access (Whitney Bateson, " + EMAIL + ")",
      calDetails: "Hi, " + NAME + "! Today's the day to send:\n\n→ Your String subscriber export (Excel, with the tags you're keeping)\n→ Your Zapier login, shared through LastPass or another secure password tool with " + EMAIL + sign },
    { date: C.dates.proReady, title: "Your Nutrition Professionals funnel is ready to test",
      note: "Your 7-email sequence, the Kit form for your Facebook lead form, and the new website opt-in and thank-you pages that replace Thinkific." },
    { date: C.dates.proDue, yours: true, form: "npro", link: RL.pro, title: "Test your Nutrition Professionals funnel",
      note: testHow + " Send anything that looks off through the form below.",
      calTitle: "Test your Nutrition Professionals funnel (Whitney Bateson, " + EMAIL + ")",
      calDetails: "Hi, " + NAME + "! Today's the day to send your feedback on your Nutrition Professionals funnel.\n\n→ Look over your opt-in page and thank-you page\n→ Sign up yourself and go through the flow: form, lead magnet delivery and emails\n→ Send anything that looks off through the form on your roadmap" + sign },
    { date: C.dates.proLive, title: "Your website opt-in goes live",
      note: "Your new opt-in replaces Thinkific, and your subscriber list is imported into Kit." },
    { away: true, date: C.dates.awayStart, end: C.dates.awayEnd, title: "Thanksgiving break" },
    { date: C.dates.adsOn, title: "Your ads are back on 🚀",
      note: "We connect your Facebook lead form to Kit through Zapier and turn your ads back on. We waited until after Thanksgiving so your ads aren't running unwatched over the holiday." },
    { date: C.dates.clientReady, title: "Your client funnels are ready to test",
      note: "Both client sequences (8 and 5 emails), their Kit forms, and your evergreen sequence with its first one or two emails, connected so subscribers move into it when they finish a lead magnet sequence." },
    { date: C.dates.clientDue, yours: true, form: "nclient", link: RL.client1, link2: RL.client2, title: "Test your client funnels",
      note: "Same as before, for both client funnels. " + testHow + " Send anything that looks off through the form below.",
      calTitle: "Test your client funnels (Whitney Bateson, " + EMAIL + ")",
      calDetails: "Hi, " + NAME + "! Today's the day to send your feedback on both client funnels.\n\n→ Look over each opt-in page and thank-you page\n→ Sign up and go through each flow\n→ Send anything that looks off through the form on your roadmap" + sign },
    { date: C.dates.finalExport, yours: true, final: true, title: "Send your final String export",
      note: "Just the people who joined your String list after " + short(D.listDue) + ", so nobody who signed up during the move gets left behind. Your String forms come down today.",
      calTitle: "Send your final String export (Whitney Bateson, " + EMAIL + ")",
      calDetails: "Hi, " + NAME + "! Today your String forms get swapped for Kit forms. Please send an export of everyone who joined your String list after " + short(D.listDue) + " (Excel, with tags) so we can bring them over." + sign },
    { date: C.dates.clientLive, title: "Your client funnels go live",
      note: "The String forms on your website are swapped for your new Kit forms." },
    { date: C.dates.complete, finish: true, title: "🏁 You're fully on Kit",
      note: "We test every form, email and automation one last time. Your team can add more evergreen emails whenever you're ready." }
  ];

  const stopDone = s => {
    if (s.step1) return access.every(a => itemDone(a.id));
    if (s.form) return !!state.sent[s.form];
    if (s.list) return itemDone("list") && itemDone("zap");
    if (s.final) return itemDone("final");
    return parse(s.end || s.date) < today;
  };

  // ---- Forms (testing feedback) ----
  const FORMS = {
    npro: { title: "Nutrition Professionals Funnel Feedback", button: "Open the feedback form" },
    nclient: { title: "Client Funnels Feedback", button: "Open the feedback form" }
  };
  const tips = `<div class="f-tip"><strong>Two tips:</strong> sign up with a different email from the one on your list (or unsubscribe when you're done), so your own address doesn't end up tagged in the funnel. And the emails arrive on their normal schedule, so you may not have them all by the due date. Send what you've seen, and email us if something looks off later.</div>`;
  function renderForm(key) {
    const f = FORMS[key], req = '<span class="req" aria-hidden="true">*</span>';
    const checks = ["I've looked over the opt-in page" + (key === "nclient" ? "s" : "") + " and thank-you page" + (key === "nclient" ? "s" : "") + ".",
      "I signed up and got my lead magnet.",
      "I've read the emails that have arrived so far."];
    return `<details class="fwrap"><summary><span class="f-sum">${f.button}</span><span class="f-sum-t">${f.title}</span></summary>
      <form class="fbody" novalidate data-key="${key}"><h4 class="f-title">${f.title}</h4>${tips}
        <div class="f-field f-checks">${checks.map(t => `<label class="f-check"><input type="checkbox" data-q="${esc(t)}" required><span>${esc(t)} ${req}</span></label>`).join("")}</div>
        <div class="f-field"><label for="${key}-t">Anything that looks off? ${req}</label><span class="f-help" id="${key}-th">Tell us which page or email and what's wrong. Something like "the thank-you page links to my old site" is perfect. All good? Just write none.</span><textarea id="${key}-t" data-q="Anything that looks off?" rows="5" required aria-describedby="${key}-th"></textarea></div>
        <div class="f-actions"><button type="submit" class="f-submit">Send my feedback</button><span class="f-req-note">${req} Required</span></div>
        <p class="f-status" role="status"></p>
      </form></details>`;
  }
  const sentCard = key => `<div class="f-sent"><span class="f-sent-ic">${tick}</span><p><strong>Sent on ${fmt(parse(state.sent[key]))}. Thank you!</strong> We're on it. Forgot something? Email us at <a class="inline" href="mailto:${EMAIL}">${EMAIL}</a>.</p></div>`;

  function calLinks(s) {
    const d = parse(s.date), end = addDay(d);
    const text = encodeURIComponent(s.calTitle), details = encodeURIComponent(s.calDetails);
    const g = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${text}&dates=${ymd(d)}/${ymd(end)}&details=${details}`;
    const o = `https://outlook.live.com/calendar/0/deeplink/compose?subject=${text}&body=${details}&startdt=${iso(d)}&enddt=${iso(end)}&allday=true`;
    const act = s.action ? `<a class="act" href="${s.action.href}">${s.action.text}</a>` : "";
    return `<div class="cal">${act}<a href="${g}" target="_blank" rel="noopener">Add to Google Calendar</a><a href="${o}" target="_blank" rel="noopener">Add to Outlook</a></div>`;
  }
  function checkRow(id, label, how) {
    const on = itemDone(id);
    return `<div class="zap-row${on ? " on" : ""}">
      <button class="box" type="button" data-id="${id}" aria-pressed="${on}" aria-label="Mark ${esc(label)} as done" ${got[id] ? "disabled" : ""}>${tick}</button>
      <div><strong>${label}</strong><span class="how">${how}</span></div></div>`;
  }
  function testLinks(s) {
    const links = [[s.link, s.link2 ? "Open client funnel 1" : "Open your opt-in page"], [s.link2, "Open client funnel 2"]].filter(l => live(l[0]));
    if (!links.length) return `<p class="after">Your test link shows up here on ${short(parse(s.form === "npro" ? C.dates.proReady : C.dates.clientReady))}.</p>`;
    return `<p class="after">${links.map(l => `<a class="acc-link" href="${esc(l[0])}" target="_blank" rel="noopener">${l[1]} →</a>`).join(" ")}</p>`;
  }

  function stopRow(s) {
    if (s.away) {
      const a = parse(s.date), b = parse(s.end);
      return `<li class="away-row"><span class="away-dot" aria-hidden="true"></span><p><strong>Out for Thanksgiving · ${short(a)} to ${b.getDate()}.</strong> Replies pick back up ${fmt(D.adsOn)}.</p></li>`;
    }
    const d = parse(s.date), done = stopDone(s), late = s.yours && !done && d < today;
    const cls = ["stop", s.yours ? "yours" : "", s.finish ? "finish" : "", s.host ? "ours-host" : "", done ? "done" : "", late ? "late" : ""].join(" ").replace(/\s+/g, " ").trim();
    const when = s.end ? fmt(d) + " to " + fmt(parse(s.end)) : fmt(d);
    return `<li class="${cls}">
      <span class="pin" aria-hidden="true"></span>
      <div class="card">
        <span class="pstamp" aria-label="Done"><b>Done</b>${short(d)}</span>
        <div class="date">${when}${s.yours ? '<span class="tag">Your stop</span>' : ""}${late ? '<span class="tag late-tag">Still open</span>' : ""}</div>
        <h4>${s.title}</h4>
        <p>${s.note}</p>
        ${s.host ? `<p class="after">Ian handles this one and will email you directly if he needs anything.</p>` : ""}
        ${s.form && !done ? testLinks(s) : ""}
        ${s.yours && !done ? calLinks(s) : ""}
        ${s.list ? checkRow("list", "String subscriber export", "Excel, with the tags you're keeping. Send it to " + EMAIL + ".") + checkRow("zap", "Zapier access", "Share your Zapier login through LastPass (or another secure password tool) with " + EMAIL + ".") : ""}
        ${s.final ? checkRow("final", "Final String export", "Only people who joined after " + short(D.listDue) + ". Send it to " + EMAIL + ".") : ""}
        ${s.form ? `<div class="form-slot" data-form="${s.form}">${state.sent[s.form] ? sentCard(s.form) : renderForm(s.form)}</div>` : ""}
      </div></li>`;
  }

  // ---- Page shell ----
  document.body.insertAdjacentHTML("afterbegin", `
  <header class="hero"><div class="hero-inner">
    <p class="brand">Whitney Bateson Digital Strategy</p>
    <p class="eyebrow">Hi, ${NAME}!</p>
    <h1>Here's your Kit migration <span style="white-space:nowrap">roadmap 🗺️</span></h1>
    <p class="lede">This is every step of your move from String to Kit, plus your website's move back to our hosting, from today until you're fully on Kit.</p>
    <p class="lede">The coral pins are your stops, the few times we need something from you. Everything else is on us, and each stop gets a stamp once it's done.</p>
    <dl class="glance">
      <div><dt>Ads back on</dt><dd>${short(D.adsOn)}</dd></div>
      <div><dt>Fully on Kit</dt><dd>${short(D.complete)}</dd></div>
    </dl>
  </div></header>
  <div class="wrap">
    <div class="links"><p>Bookmark this page. Questions? Email us at <a class="mail" href="mailto:${EMAIL}">${EMAIL}</a></p></div>

    <section class="access" id="access" aria-labelledby="access-h"${step1Hidden ? " hidden" : ""}>
      <div class="s1-head">
        <h2 id="access-h">Step 1: Send us your files and access 🔑</h2>
        <div class="s1-progress" aria-live="polite"><span class="s1-count"></span><span class="s1-bar"><i></i></span></div>
      </div>
      <div class="s1-body">
        <p class="access-intro">We need these by <strong>${fmt(D.assetsDue)}</strong> to start setting up Kit. Tick each one off as you send it.</p>
        <ul id="access-list"></ul>
        <p class="s1-later"><strong>Coming up later:</strong></p>
        <ul class="later-list">
          <li>Your String subscriber export and Zapier access, ${fmt(D.listDue)}</li>
          <li>A final export of anyone who joined String after ${short(D.listDue)}, ${fmt(D.finalExport)}</li>
          <li>Please finish any emails you have scheduled in String, so Kit starts fresh.</li>
        </ul>
      </div>
    </section>

    <div class="phase-head">
      <span class="phase-num">Your route</span>
      <h2>Moving you to Kit</h2>
      <p>${short(D.kickoff)} to ${short(D.complete)}. We'll build each funnel in the order you asked for: your Nutrition Professionals funnel first, then your client funnels.</p>
    </div>
    <div class="legend" aria-hidden="true"><span><i class="pin y"></i>Your stop</span><span><i class="pin"></i>Our work</span></div>
    <ol class="route" id="route"></ol>

    <div class="reply">
      <p><strong>After ${short(D.complete)}:</strong> your team can add more evergreen emails whenever you're ready. You'll have about three weeks fully on Kit before you cancel String by ${fmt(D.stringCancel)}.</p>
      <p><strong>Something come up?</strong> Hit reply to any of our emails and we'll adjust the route with you.</p>
    </div>
  </div>
  <section class="finale"><div class="finale-inner">
    <h2>Final destination: you're fully on Kit 🎉</h2>
    <p>All three funnels running in Kit, your ads feeding new subscribers straight into your welcome sequences, and your evergreen ready for your team to keep adding to.</p>
  </div><footer class="site-foot" aria-hidden="true"></footer></section>`);

  function renderAccess() {
    document.getElementById("access-list").innerHTML = access.map(a => {
      const done = itemDone(a.id), days = Math.round((D.assetsDue - today) / 86400000);
      const label = got[a.id] ? "Got it, thanks!" : done ? "Done" : days < 0 ? "Still needed" : "Needed by " + fmt(D.assetsDue);
      return `<li class="${got[a.id] ? "got" : done ? "mine" : ""}">
        <button class="box" type="button" data-id="${a.id}" aria-pressed="${done}" aria-label="Mark ${esc(a.item)} as done" ${got[a.id] ? 'data-locked="1"' : ""}>${tick}</button>
        <div><strong>${a.item}</strong><span class="how">${a.short}</span></div>
        <span class="due${!done && days <= 3 ? " soon" : ""}">${label}</span></li>`;
    }).join("");
    const n = access.filter(a => itemDone(a.id)).length;
    document.querySelector(".s1-count").textContent = n + " of " + access.length + " done";
    document.querySelector(".s1-bar i").style.width = (n / access.length * 100) + "%";
  }
  function renderRoute() { document.getElementById("route").innerHTML = stops.map(stopRow).join(""); }
  function renderAll() { renderAccess(); renderRoute(); }
  renderAll();

  // Checkboxes: save locally and log to Notion
  document.addEventListener("click", e => {
    const btn = e.target.closest("button.box"); if (!btn || btn.dataset.locked || btn.disabled) return;
    const id = btn.dataset.id; state.checks[id] = !state.checks[id]; save(); renderAll();
    if (state.checks[id]) fetch(API + "/submit", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ client: CLIENT, token: TOKEN, form: "access", item: id }) }).catch(() => {});
  });

  // Feedback forms → Notion
  document.addEventListener("submit", async e => {
    const form = e.target.closest("form.fbody"); if (!form) return;
    e.preventDefault();
    if (!form.checkValidity()) { form.reportValidity(); return; }
    const btn = form.querySelector(".f-submit"), st = form.querySelector(".f-status"), label = btn.textContent;
    const answers = [];
    form.querySelectorAll("textarea[data-q]").forEach(t => answers.push({ q: t.dataset.q, a: t.value.trim() }));
    form.querySelectorAll('input[type="checkbox"][data-q]').forEach(c => answers.push({ q: c.dataset.q, a: c.checked ? "Yes" : "No" }));
    btn.disabled = true; btn.textContent = "Sending..."; st.textContent = "";
    try {
      const res = await fetch(API + "/submit", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ client: CLIENT, token: TOKEN, form: form.dataset.key, answers }) });
      if (!res.ok) throw new Error("status " + res.status);
      state.sent[form.dataset.key] = iso(new Date()); save(); renderAll();
    } catch (err) {
      btn.disabled = false; btn.textContent = label;
      st.textContent = "Something went wrong sending this. Please try again, or email your answers to " + EMAIL + ".";
    }
  });

  // Notion is the source of truth, so the page matches on every device
  fetch(API + "/status?client=" + encodeURIComponent(CLIENT) + "&token=" + encodeURIComponent(TOKEN))
    .then(r => r.ok ? r.json() : null)
    .then(data => { if (!data) return; state.sent = data.sent || {}; state.checks = Object.assign({}, data.access || {}); save(); renderAll(); })
    .catch(() => {});
})();
</script>
</body>
</html>
