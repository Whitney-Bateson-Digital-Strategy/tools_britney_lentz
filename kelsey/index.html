<body>
<script>
  // Kelsey's settings. The design and wording live in /assets (shared by every client).
  // Kelsey (Restore Family Therapy). Bought through the Black Friday offer. She's also getting an
  // Instagram refresh from us, and her answers for that are due the same day as her funnel intake (Dec 1).
  window.ROADMAP = {
    client: "kelsey",                        // must match the folder name and clients.json
    token: "61WaJ1BB8IzEN0FIswf7d9jFErgNpiE7",       // must match clients.json
    firstName: "Kelsey",
    bonusWeek: false,                        // standard one week of ad support (Jan 22 to 29); flip to true if she gets the bonus week
    digitalSeroUrl: "",                      // paste her DigitalSero link once we have it
    commandCenterUrl: "#",                   // paste her Funnel Command Center link; the button unlocks on handoff day
    showReview: false,                       // hides the "Ready for your review" card until there's something to review
    reviewLinks: {
      direction: "#",                        // lead magnet direction doc
      lmemail: "#"                           // lead magnet + email sequence
    },

    // Mark each item true once it's in. When the first four are all true, Step 1 hides itself.
    // web: she's a WBDS website/SEO client, so we already have access to her site.
    received: { email: false, web: true, fb: false, ack: false, zap: false },

    // Standard 40-business-day schedule, counted from her intake due date (Dec 1 = day 3),
    // skipping the holiday break (Dec 24 to Jan 1).
    dates: {
      access: "2026-12-01",            // onboarding questionnaire, access + schedule acknowledgement due (same day as her Instagram answers)
      directionArrives: "2026-12-04",  // we send the lead magnet direction
      directionDue: "2026-12-08",      // she approves the direction
      lmArrives: "2026-12-22",         // we send the lead magnet + emails
      revisionsDue: "2027-01-05",      // her revisions + Zapier due (window covers the holiday break)
      handoff: "2027-01-19",           // funnel handoff, Command Center opens
      editsDue: "2027-01-21",          // her funnel edits due
      complete: "2027-01-22",          // final fixes done
      adsOn: "2027-01-22"              // she turns ads on, ad support Jan 22 to 29, recap Jan 29
    },

    // The holiday break falls during her lead magnet + email review
    away: { start: "2026-12-24", end: "2027-01-01", back: "2027-01-04", reason: "the holidays",
            note: "That's why you have until Tue, Jan 5 for your feedback." },

    copy: {
      // Step 1 only lists access items, so this is where her intake deadline shows up
      accessIntro: "Along with your onboarding questionnaire (also due Tue, Dec 1)"
    }
  };
</script>
<script src="/assets/roadmap.js"></script>
